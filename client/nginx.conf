server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match Express JSON payload limit for encrypted vault uploads
    client_max_body_size 10m;

    # Gzip compression for JSON, CSS, and JS assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/x-javascript
        text/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy all /api/ requests to the internal Express backend
    location /api/ {
        proxy_pass http://vault-server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Cache immutable hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application (SPA) fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
